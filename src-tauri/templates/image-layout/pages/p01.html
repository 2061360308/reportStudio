<div class="paper"><div class="page">{% if images %}{% set mode = "four" if layout == "four" else ("two" if layout == "two" else "one") %}{% set per_page = 1 if mode == "one" else (2 if mode == "two" else 4) %}{% for group in images|batch(per_page) %}<section class="sheet mode-{{ mode }}">{% for src in group %}<figure class="cell"><img src="{{ src }}" alt=""></figure>{% endfor %}</section>{% endfor %}{% else %}<div class="empty">暂无图片</div>{% endif %}</div></div>
