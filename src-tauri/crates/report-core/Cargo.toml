[package]
name = "report-core"
version = "0.1.0"
edition = "2021"
description = "报告工坊模板渲染核心（与 Tauri 无关）"
license = "MIT"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
minijinja = { version = "2", features = ["loader"] }
chrono = "0.4"
sha2 = "0.10"
hex = "0.4"
walkdir = "2"
zip = "2"
uuid = { version = "1", features = ["v4"] }
