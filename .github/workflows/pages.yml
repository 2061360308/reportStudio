name: pages

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'scripts/prepare-pages-downloads.mjs'
      - '.github/workflows/pages.yml'
  workflow_run:
    workflows: [release]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: 拉取 latest.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p .release
          if gh release view --json tagName >/dev/null 2>&1; then
            for i in $(seq 1 10); do
              if gh release download --pattern latest.json --dir .release --clobber; then
                break
              fi
              sleep 3
            done
            test -f .release/latest.json || { echo "latest.json 下载失败"; exit 1; }
          else
            echo "暂无 Release，封面下载按钮将回退到 Releases"
          fi

      - name: 下载最新应用与模板
        id: prepare_downloads
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PAGES_CUSTOM_DOMAIN: ${{ vars.PAGES_CUSTOM_DOMAIN }}
        run: |
          PAGES_BASE_URL="${PAGES_CUSTOM_DOMAIN:-oilu.cn/reportStudio}"
          case "$PAGES_BASE_URL" in
            http://*|https://*) ;;
            *) PAGES_BASE_URL="https://$PAGES_BASE_URL" ;;
          esac
          PAGES_BASE_URL="${PAGES_BASE_URL%/}/"
          echo "pages_base_url=$PAGES_BASE_URL" >> "$GITHUB_OUTPUT"
          node scripts/prepare-pages-downloads.mjs \
            --latest .release/latest.json \
            --docs docs \
            --repo "${{ github.repository }}" \
            --base-url "$PAGES_BASE_URL"

      - uses: actions/configure-pages@v5
        with:
          # 可选：配置 PAGES_TOKEN（PAT，repo 或 Pages write 权限）后自动启用 Pages。
          # 未配置时必须先在 Settings → Pages → Source 选择 GitHub Actions。
          enablement: ${{ secrets.PAGES_TOKEN != '' }}
          token: ${{ secrets.PAGES_TOKEN || github.token }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - id: deployment
        uses: actions/deploy-pages@v4

      - name: 刷新 EdgeOne 缓存
        uses: 2061360308/edgeone-purge-action@v1
        with:
          secret_id: ${{ vars.TENCENT_SECRET_ID }}
          secret_key: ${{ secrets.TENCENT_SECRET_KEY }}
          zone_id: ${{ vars.EDGEONE_ZONE_ID }}
          type: purge_prefix
          paths: ${{ steps.prepare_downloads.outputs.pages_base_url }}
          method: invalidate
